name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: "Lambda Function Name"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform  # run commands inside terraform folder

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -var="function_name=${{ github.event.inputs.function_name }}" -var-file="dev.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var="function_name=${{ github.event.inputs.function_name }}" -var-file="dev.tfvars"
